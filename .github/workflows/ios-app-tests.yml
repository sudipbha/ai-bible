# INACTIVE TEMPLATE. GitHub runs nothing from this path.
# It becomes a workflow only if someone copies it to .github/workflows/ (see ci/README.md).
# Synthetic fixtures only: no signing, no secrets, no caches. The only upload is the UI tests'
# named screenshots of the synthetic app (kept 7 days), so people without a Mac can see it.
name: AIBible iOS unit tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/ai-bible-ios/**"

permissions:
  contents: read

concurrency:
  group: aibible-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26            # standard GitHub-hosted arm64 image (not -large / -xlarge)
    timeout-minutes: 30
    env:
      # Pinned from the runner-images inventory for macos-26 arm64 image 20260907.0351.1
      # (macOS 26.6.2): Xcode 26.6, build 17F113. The script fails if either differs.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      AIBIBLE_EXPECT_XCODE_BUILD: 17F113
      # One ephemeral iPhone SE (3rd generation) on the installed iOS 26.2 runtime (run 36367022185
      # used iOS 26.5, where local StoreKit test sessions failed with SKInternalErrorDomain Code=3).
      # The image lists no pre-created SE; the script checks the runtime supports this device type
      # and fails without substituting another device or downloading a runtime.
      AIBIBLE_SIM_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
      AIBIBLE_SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
    steps:
      - name: Check out (read-only token, not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate project and run unit tests
        env:
          AIBIBLE_SCREENSHOT_DIR: ${{ runner.temp }}/aibible-screenshots
        run: bash apps/ai-bible-ios/ci/run-tests.sh

      - name: Upload screenshots (synthetic fixture only)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aibible-screenshots
          path: ${{ runner.temp }}/aibible-screenshots
          if-no-files-found: warn
          retention-days: 7
