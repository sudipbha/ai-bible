# XcodeGen spec — the source of truth for the Xcode project.
# Generate on a Mac with `xcodegen generate` (see README). Not run in the authoring environment.
name: AIBible
options:
  bundleIdPrefix: com.example.aibible   # placeholder; replace with the owner's reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AIBible:
    type: application
    platform: iOS
    sources:
      - path: AIBible
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
      - path: AIBible/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aibible.app   # placeholder
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "AI Bible"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only for v1; iPad runs it in compatibility mode
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""          # left empty on purpose; set on the owner's Mac
  AIBibleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIBibleTests
    dependencies:
      - target: AIBible
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aibible.tests   # placeholder
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AIBible.app/AIBible"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AIBible:
    build:
      targets:
        AIBible: all
        AIBibleTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AIBibleTests
